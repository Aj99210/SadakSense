<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SadakSense - System Initialization</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;600;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030508;
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Topographical / Tech Grid */
        .topo-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 102, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 102, 0, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 2;
            pointer-events: none;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 10s linear infinite;
        }

        @keyframes gridMove {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 50px;
            }
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 30%, #020305 100%);
            z-index: 3;
            pointer-events: none;
        }

        .ui-layer {
            position: absolute;
            z-index: 20;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            box-sizing: border-box;
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: rgba(10, 12, 16, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 102, 0, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 102, 0, 0.05);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            transform: skewX(-25deg);
            animation: panelShimmer 4s infinite;
        }

        @keyframes panelShimmer {
            0% {
                left: -100%;
            }

            20% {
                left: 200%;
            }

            100% {
                left: 200%;
            }
        }

        /* High-tech Corners */
        .corner-deco {
            position: absolute;
            width: 12px;
            height: 12px;
            border: 2px solid #ff6600;
        }

        .top-left {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }

        .top-right {
            top: -1px;
            right: -1px;
            border-left: none;
            border-bottom: none;
        }

        .bottom-left {
            bottom: -1px;
            left: -1px;
            border-right: none;
            border-top: none;
        }

        .bottom-right {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }

        .title-glitch {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 2px 0 0 #ff6600, -2px 0 0 #00e5ff, 0 0 20px rgba(255, 102, 0, 0.5);
            animation: subtleGlitch 3s infinite;
        }

        @keyframes subtleGlitch {

            0%,
            100% {
                text-shadow: 2px 0 0 #ff6600, -2px 0 0 #00e5ff, 0 0 20px rgba(255, 102, 0, 0.5);
            }

            92% {
                text-shadow: 2px 0 0 #ff6600, -2px 0 0 #00e5ff, 0 0 20px rgba(255, 102, 0, 0.5);
            }

            94% {
                text-shadow: -3px 2px 0 #ff6600, 2px -2px 0 #00e5ff, 0 0 20px rgba(255, 102, 0, 0.8);
                transform: translate(-1px, 1px);
            }

            96% {
                text-shadow: 2px 0 0 #ff6600, -2px 0 0 #00e5ff, 0 0 20px rgba(255, 102, 0, 0.5);
                transform: translate(0, 0);
            }
        }

        /* Custom Radar/Scanner */
        .sat-scanner {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 1px dashed rgba(0, 229, 255, 0.4);
            position: relative;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.1) 0%, transparent 70%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sat-sweep {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(0, 229, 255, 0.5) 360deg);
            animation: sweep 2s linear infinite;
        }

        @keyframes sweep {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(0, 0, 0, 0.6);
            margin-top: 15px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff3300, #ff9900, #00e5ff);
            background-size: 200% 100%;
            width: 0%;
            position: relative;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.6);
            animation: gradientShift 2s linear infinite;
        }

        @keyframes gradientShift {
            0% {
                background-position: 100% 0;
            }

            100% {
                background-position: -100% 0;
            }
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(255, 255, 255, 0.02) 51%, transparent 51%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 30;
        }

        .status-pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }
    </style>
</head>

<body>

    <!-- Overlay Effects -->
    <div class="topo-grid"></div>
    <div class="vignette"></div>
    <div class="scan-line"></div>

    <!-- 3D Scene -->
    <div id="canvas-container"></div>

    <!-- UI Layer -->
    <div class="ui-layer">

        <!-- Header Section -->
        <div class="flex justify-between items-start w-full">
            <!-- Title -->
            <div class="relative pl-5 border-l-2 border-orange-500">
                <h1 class="text-4xl md:text-5xl title-glitch leading-none">SadakSense</h1>
                <div class="flex items-center gap-3 mt-2">
                    <span
                        class="bg-orange-900/40 border border-orange-500/50 px-2 py-0.5 rounded text-[10px] text-orange-400 font-mono tracking-widest">v1.0.4-RQI</span>
                    <span class="text-[10px] text-gray-400 font-mono tracking-[0.2em] flex items-center gap-1">
                        <i data-lucide="satellite" class="w-3 h-3 text-cyan-400"></i> ORBITAL LINK ACTIVE
                    </span>
                </div>
            </div>

            <!-- Systems Panel -->
            <div class="glass-panel p-3 md:p-4 rounded-lg flex gap-6 items-center">
                <div class="corner-deco top-left"></div>
                <div class="corner-deco bottom-right"></div>

                <div class="flex flex-col gap-2 font-mono">
                    <div class="flex items-center justify-between w-36">
                        <span class="text-[10px] text-gray-400 uppercase tracking-widest">Sat-Telemetry</span>
                        <div class="status-pulse text-cyan-400 bg-cyan-400 animate-pulse"></div>
                    </div>
                    <div class="flex items-center justify-between w-36">
                        <span class="text-[10px] text-gray-400 uppercase tracking-widest">RQI Engine</span>
                        <div class="status-pulse text-orange-500 bg-orange-500"></div>
                    </div>
                    <div class="flex items-center justify-between w-36">
                        <span class="text-[10px] text-gray-400 uppercase tracking-widest">Traffic Sim</span>
                        <div class="status-pulse text-yellow-400 bg-yellow-400"></div>
                    </div>
                </div>

                <!-- Radar Visual -->
                <div class="sat-scanner ml-2 hidden md:flex">
                    <div class="sat-sweep"></div>
                    <i data-lucide="map"
                        class="relative z-10 w-6 h-6 text-cyan-300 drop-shadow-[0_0_5px_rgba(0,229,255,0.8)]"></i>
                </div>
            </div>
        </div>

        <!-- Middle Spacer -->
        <div class="flex-grow flex items-center justify-center pointer-events-none">
            <!-- Targeting Reticle Overlay -->
            <div
                class="w-64 h-64 border border-white/5 rounded-full relative animate-[spin_20s_linear_infinite] hidden md:block">
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-1 h-4 bg-orange-500/50"></div>
                <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1 h-4 bg-orange-500/50"></div>
                <div class="absolute left-0 top-1/2 -translate-y-1/2 w-4 h-1 bg-cyan-500/50"></div>
                <div class="absolute right-0 top-1/2 -translate-y-1/2 w-4 h-1 bg-cyan-500/50"></div>
            </div>
        </div>

        <!-- Footer Section -->
        <div class="flex flex-col lg:flex-row gap-4 items-stretch h-56 lg:h-48">

            <!-- Terminal / Logs -->
            <div class="glass-panel w-full lg:w-1/3 rounded-lg flex flex-col p-4">
                <div class="corner-deco top-right"></div>
                <div class="flex justify-between items-center mb-2 border-b border-gray-700/50 pb-2">
                    <span class="text-xs text-orange-400 font-bold uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="terminal-square" class="w-4 h-4"></i> Analysis Log
                    </span>
                    <span class="text-[10px] text-gray-500 font-mono">/engine/rqi_calc</span>
                </div>
                <div id="terminal-log"
                    class="font-mono text-[11px] text-cyan-100/70 space-y-1.5 overflow-hidden flex-col flex justify-end h-full">
                    <!-- JS injects here -->
                </div>
            </div>

            <!-- Main Loader & Stats -->
            <div class="glass-panel w-full lg:w-2/3 rounded-lg p-5 flex flex-col justify-between relative">
                <div class="corner-deco bottom-left"></div>

                <div class="flex justify-between items-start">
                    <div class="flex flex-col">
                        <span class="text-[10px] text-cyan-400 font-bold uppercase tracking-[0.3em] mb-1">Process
                            Status</span>
                        <h2 id="loading-text"
                            class="text-2xl md:text-3xl font-bold text-white tracking-widest uppercase">INITIALIZING
                            SENSORS...</h2>
                    </div>
                    <div class="text-right flex items-baseline gap-1">
                        <span id="percentage"
                            class="text-5xl md:text-6xl font-bold font-share-tech-mono text-orange-500 leading-none drop-shadow-[0_0_10px_rgba(255,102,0,0.5)]">0</span>
                        <span class="text-2xl text-orange-700">%</span>
                    </div>
                </div>

                <!-- Congestion Visualizer -->
                <div class="w-full h-10 mt-3 flex items-end gap-[2px] opacity-80" id="bars-container">
                    <!-- Bars injected by JS -->
                </div>

                <!-- Progress Bar -->
                <div class="mt-4">
                    <div class="progress-container">
                        <div id="main-progress" class="progress-bar"></div>
                    </div>
                    <div class="flex justify-between mt-2 text-[10px] text-gray-400 font-mono uppercase tracking-wider">
                        <span>Sectors: <span class="text-cyan-400">Mapped</span></span>
                        <span>Model: <span class="text-orange-400">Heuristic</span></span>
                        <span id="geo-coords">LAT: 28.61°N / LNG: 77.20°E</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Completion Overlay -->
    <div id="success-overlay"
        class="absolute inset-0 bg-cyan-900/20 z-50 pointer-events-none flex items-center justify-center opacity-0 scale-110">
        <div class="glass-panel px-12 py-8 text-center border-cyan-400 shadow-[0_0_50px_rgba(0,229,255,0.2)]">
            <h1
                class="text-3xl md:text-5xl text-cyan-400 font-bold tracking-[0.2em] uppercase font-orbitron drop-shadow-[0_0_10px_rgba(0,229,255,0.8)]">
                ANALYSIS COMPLETE</h1>
            <p class="text-cyan-100 font-mono mt-4 tracking-widest text-sm uppercase">Routing to Dashboard...</p>
        </div>
    </div>

    <script>
        // --- ICONS ---
        lucide.createIcons();

        // --- CONFIG ---
        const LOADING_DURATION = 6500;
        const NEXT_PAGE = 'landing.html';

        // --- THREE.JS SCENE (Traffic/Road Data Visualization) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030508, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 40);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 1. Digital Terrain Map
        const planeGeo = new THREE.PlaneGeometry(150, 150, 40, 40);
        const planeMat = new THREE.MeshBasicMaterial({
            color: 0x0a1018,
            wireframe: true,
            transparent: true,
            opacity: 0.15
        });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;

        // Add subtle noise to terrain
        const vertices = plane.geometry.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
            vertices[i + 2] = (Math.random() - 0.5) * 4;
        }
        scene.add(plane);

        // 2. Road Network (Splines representing highways/streets)
        const roads = [];
        const trafficParticles = [];
        const roadGlowLines = []; // For animated glow pulse

        // Helper to create curved roads
        function createRoad(points, colorHex, isCongested) {
            const curve = new THREE.CatmullRomCurve3(points);
            const pts = curve.getPoints(200); // Higher resolution for smoother curves
            const geo = new THREE.BufferGeometry().setFromPoints(pts);

            // Outer glow line (wider, dimmer — creates neon underglow)
            const glowMat = new THREE.LineBasicMaterial({
                color: colorHex,
                transparent: true,
                opacity: 0.08,
                linewidth: 2,
                blending: THREE.AdditiveBlending
            });
            const glowLine = new THREE.Line(geo.clone(), glowMat);
            glowLine.position.y = -0.05;
            scene.add(glowLine);

            // Base Road Line — brighter core
            const mat = new THREE.LineBasicMaterial({
                color: colorHex,
                transparent: true,
                opacity: 0.5,
                linewidth: 2
            });
            const roadLine = new THREE.Line(geo, mat);
            scene.add(roadLine);
            roads.push(curve);

            // Store for animated pulsing
            roadGlowLines.push({ line: roadLine, glow: glowLine, color: colorHex, congested: isCongested });

            // Dashed lane-marking line (adds realism)
            const dashGeo = new THREE.BufferGeometry().setFromPoints(pts);
            const dashMat = new THREE.LineDashedMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.06,
                dashSize: 1.5,
                gapSize: 2,
                linewidth: 1
            });
            const dashLine = new THREE.Line(dashGeo, dashMat);
            dashLine.computeLineDistances();
            dashLine.position.y = 0.02;
            scene.add(dashLine);

            // Traffic Data Points — main particles
            const particleCount = isCongested ? 50 : 20;
            const size = isCongested ? 0.55 : 0.35;
            const pGeo = new THREE.BufferGeometry();
            const pPos = new Float32Array(particleCount * 3);
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));

            const pMat = new THREE.PointsMaterial({
                color: isCongested ? 0xff3300 : 0x00ffcc,
                size: size,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });

            const particles = new THREE.Points(pGeo, pMat);
            scene.add(particles);

            // Trailing glow particles (larger, dimmer — creates comet-tail effect)
            const trailCount = Math.floor(particleCount * 0.6);
            const trailGeo = new THREE.BufferGeometry();
            const trailPos = new Float32Array(trailCount * 3);
            trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));

            const trailMat = new THREE.PointsMaterial({
                color: isCongested ? 0xff6600 : 0x00e5ff,
                size: size * 2.2,
                transparent: true,
                opacity: 0.15,
                blending: THREE.AdditiveBlending
            });
            const trailParticles = new THREE.Points(trailGeo, trailMat);
            scene.add(trailParticles);

            // Store metadata for animation
            trafficParticles.push({
                mesh: particles,
                trail: trailParticles,
                curve: curve,
                count: particleCount,
                trailCount: trailCount,
                speeds: Array(particleCount).fill(0).map(() => (isCongested ? 0.0012 : 0.0035) + Math.random() * 0.002),
                progress: Array(particleCount).fill(0).map(() => Math.random())
            });

            // Add glow spheres at endpoints (intersection nodes)
            [points[0], points[points.length - 1]].forEach(p => {
                const nodeSphere = new THREE.Mesh(
                    new THREE.SphereGeometry(0.5, 12, 12),
                    new THREE.MeshBasicMaterial({
                        color: colorHex,
                        transparent: true,
                        opacity: 0.4,
                        blending: THREE.AdditiveBlending
                    })
                );
                nodeSphere.position.copy(p);
                scene.add(nodeSphere);
            });
        }

        // Generate intersecting road paths
        createRoad([
            new THREE.Vector3(-60, 0.5, -40), new THREE.Vector3(-20, 0.5, -10),
            new THREE.Vector3(10, 0.5, 0), new THREE.Vector3(40, 0.5, 20), new THREE.Vector3(60, 0.5, 50)
        ], 0x00e5ff, false); // Smooth/Fast Highway (Cyan)

        createRoad([
            new THREE.Vector3(50, 0.5, -50), new THREE.Vector3(20, 0.5, -20),
            new THREE.Vector3(0, 0.5, 10), new THREE.Vector3(-20, 0.5, 30), new THREE.Vector3(-50, 0.5, 60)
        ], 0xff6600, true); // Moderately Damaged/Congested (Orange)

        createRoad([
            new THREE.Vector3(-40, 0.5, 40), new THREE.Vector3(-10, 0.5, 15),
            new THREE.Vector3(15, 0.5, -10), new THREE.Vector3(30, 0.5, -30), new THREE.Vector3(50, 0.5, -60)
        ], 0xff0000, true); // Heavily Damaged/High Congestion (Red)

        // Additional roads for denser network
        createRoad([
            new THREE.Vector3(-55, 0.5, 0), new THREE.Vector3(-30, 0.5, -15),
            new THREE.Vector3(0, 0.5, -25), new THREE.Vector3(30, 0.5, -15), new THREE.Vector3(55, 0.5, 0)
        ], 0x00e5ff, false); // Secondary smooth highway

        createRoad([
            new THREE.Vector3(-30, 0.5, -55), new THREE.Vector3(-15, 0.5, -25),
            new THREE.Vector3(0, 0.5, 5), new THREE.Vector3(15, 0.5, 25), new THREE.Vector3(30, 0.5, 55)
        ], 0xff9900, true); // Moderate arterial

        createRoad([
            new THREE.Vector3(40, 0.5, 40), new THREE.Vector3(20, 0.5, 10),
            new THREE.Vector3(-5, 0.5, -5), new THREE.Vector3(-25, 0.5, -25), new THREE.Vector3(-45, 0.5, -50)
        ], 0x00ccaa, false); // Connector road (teal)

        createRoad([
            new THREE.Vector3(-50, 0.5, -30), new THREE.Vector3(-15, 0.5, -5),
            new THREE.Vector3(20, 0.5, 15), new THREE.Vector3(50, 0.5, 35)
        ], 0xff4400, true); // Inner ring segment

        // 3. Central Analysis Node / Hologram Cylinder
        const nodeGeo = new THREE.CylinderGeometry(8, 8, 40, 32, 1, true);
        const nodeMat = new THREE.MeshBasicMaterial({
            color: 0x00e5ff,
            transparent: true,
            opacity: 0.05,
            wireframe: true,
            side: THREE.DoubleSide
        });
        const centerNode = new THREE.Mesh(nodeGeo, nodeMat);
        scene.add(centerNode);

        // Center base ring
        const ringGeo = new THREE.RingGeometry(8, 8.5, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xff6600, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.1;
        scene.add(ring);

        // --- ANIMATION LOOP ---
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.05;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.05;
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // Animate Traffic Particles along splines
            trafficParticles.forEach(sys => {
                const positions = sys.mesh.geometry.attributes.position.array;
                const trailPositions = sys.trail ? sys.trail.geometry.attributes.position.array : null;

                for (let i = 0; i < sys.count; i++) {
                    sys.progress[i] += sys.speeds[i];
                    if (sys.progress[i] > 1) sys.progress[i] = 0; // Loop around

                    const point = sys.curve.getPointAt(sys.progress[i]);
                    positions[i * 3] = point.x;
                    positions[i * 3 + 1] = point.y + Math.sin(t * 8 + i * 1.7) * 0.15;
                    positions[i * 3 + 2] = point.z;

                    // Update trail particles (offset slightly behind)
                    if (trailPositions && i < sys.trailCount) {
                        const trailProgress = Math.max(0, sys.progress[i] - 0.015);
                        const trailPt = sys.curve.getPointAt(trailProgress);
                        trailPositions[i * 3] = trailPt.x;
                        trailPositions[i * 3 + 1] = trailPt.y + Math.sin(t * 8 + i * 1.7) * 0.15;
                        trailPositions[i * 3 + 2] = trailPt.z;
                    }
                }
                sys.mesh.geometry.attributes.position.needsUpdate = true;
                if (sys.trail) sys.trail.geometry.attributes.position.needsUpdate = true;
            });

            // Animate road glow pulsing
            roadGlowLines.forEach((r, idx) => {
                const pulse = 0.3 + Math.sin(t * 2 + idx * 1.5) * 0.15;
                r.line.material.opacity = pulse;
                r.glow.material.opacity = pulse * 0.2;
            });

            // Rotate Center Node
            centerNode.rotation.y = t * 0.5;
            ring.scale.set(1 + Math.sin(t * 3) * 0.1, 1 + Math.sin(t * 3) * 0.1, 1);

            // Camera Parallax
            camera.position.x += (mouseX - camera.position.x) * 0.02;
            camera.position.y += ((30 - mouseY) - camera.position.y) * 0.02;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // --- CHART VISUALIZER (CSS Based for crisper UI) ---
        const barsContainer = document.getElementById('bars-container');
        const numBars = 30;
        for (let i = 0; i < numBars; i++) {
            const bar = document.createElement('div');
            bar.className = 'flex-1 bg-gradient-to-t from-orange-600 to-cyan-400 rounded-t-sm transition-all duration-75';
            bar.style.height = '10%';
            barsContainer.appendChild(bar);
        }

        function animateBars() {
            Array.from(barsContainer.children).forEach((bar, i) => {
                // Generate a wave-like congestion pattern
                const height = 15 + Math.random() * 40 + Math.sin(Date.now() * 0.002 + i * 0.2) * 30;
                bar.style.height = `${Math.max(5, Math.min(100, height))}%`;

                // Color shift based on height (higher = redder/congested)
                if (height > 70) bar.style.background = 'linear-gradient(to top, #ff3300, #ff9900)';
                else if (height > 40) bar.style.background = 'linear-gradient(to top, #ff9900, #00e5ff)';
                else bar.style.background = 'linear-gradient(to top, #0066ff, #00e5ff)';
            });
            requestAnimationFrame(animateBars);
        }

        // --- LOGIC & PROGRESS ---
        const logEl = document.getElementById('terminal-log');
        const pctEl = document.getElementById('percentage');
        const progEl = document.getElementById('main-progress');
        const txtEl = document.getElementById('loading-text');

        const sysLogs = [
            "Initiating satellite uplink on secure channel...",
            "Downloading topological sector grids...",
            "Loading heuristic models: [RQI_V4.weights]",
            "Scanning road surface parameters...",
            "Detected: Pothole_Dense (Confidence: 89%)",
            "Detected: Smooth_Pavement (Confidence: 94%)",
            "Calculating Road Quality Indices (RQI)...",
            "Cross-referencing RQI with speed limits...",
            "Simulating traffic flow vectors...",
            "Generating congestion heatmaps...",
            "Analytics payload formatted for UI mapping."
        ];

        let logIdx = 0;
        function addLog(msg) {
            const row = document.createElement('div');
            const time = new Date().toISOString().split('T')[1].slice(0, 8);
            row.innerHTML = `<span class="text-gray-500">[${time}]</span> <span class="text-orange-500 font-bold">»</span> ${msg}`;
            logEl.appendChild(row);
            if (logEl.children.length > 6) logEl.removeChild(logEl.firstChild);
        }

        // Start sequences on load
        window.onload = function () {
            animate();
            animateBars();
            addLog("System boot sequence initiated.");

            let progress = { val: 0 };

            gsap.to(progress, {
                val: 100,
                duration: LOADING_DURATION / 1000,
                ease: "power1.inOut",
                onUpdate: function () {
                    const cur = Math.floor(progress.val);
                    pctEl.innerText = cur;
                    progEl.style.width = cur + "%";

                    // Text States
                    if (cur < 25) txtEl.innerText = "UPLINK ESTABLISHED...";
                    else if (cur < 50) txtEl.innerText = "SCANNING TOPOLOGY...";
                    else if (cur < 75) txtEl.innerText = "CALCULATING RQI...";
                    else txtEl.innerText = "SIMULATING TRAFFIC...";

                    // Logs simulation
                    if (cur % 9 === 0 && logIdx < sysLogs.length) {
                        addLog(sysLogs[logIdx++]);
                    }

                    // Randomize coords slightly to simulate scanning
                    if (cur % 5 === 0) {
                        const lat = (28.61 + Math.random() * 0.05).toFixed(4);
                        const lng = (77.20 + Math.random() * 0.05).toFixed(4);
                        document.getElementById('geo-coords').innerText = `LAT: ${lat}°N / LNG: ${lng}°E`;
                    }
                },
                onComplete: function () {
                    const tl = gsap.timeline();

                    tl.to('#success-overlay', { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" })
                        .to('.ui-layer', { opacity: 0, duration: 0.4 }, "-=0.2")
                        .to('#canvas-container', {
                            scale: 2.5,
                            opacity: 0,
                            duration: 1,
                            ease: "power3.in"
                        })
                        .call(() => {
                            try {
                                window.location.replace(NEXT_PAGE);
                            } catch (e) {
                                document.body.innerHTML = `<div class="flex h-screen w-full items-center justify-center bg-[#030508] text-cyan-400 font-mono text-xl tracking-widest text-center">ANALYTICS ENGINE READY<br><br><span class="text-sm text-gray-500">Redirecting to Dashboard...</span></div>`;
                            }
                        });
                }
            });
        };

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>

</html>
